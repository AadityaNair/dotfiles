### Updates
update_check = false
show_whats_new = false

### Sync
auto_sync = true
sync_address = "https://api.atuin.sh"
sync_frequency = "5m"
network_timeout = "30s"
network_connect_timeout = "5s"
local_timeout = "2s"
# extra_headers

### Stats
dialect = "uk"

### Search
# TODO: Daemon-fuzzy
search_mode = "fuzzy" 
filter_mode = "global"
workspaces = false
# search_mode_shell_up_key_binding
# filter_mode_shell_up_key_binding
# inline_height_shell_up_key_binding


### Output
style = "full"
invert = false
show_preview = false
show_help = true
show_tabs = false
exit_mode = "return-original"
# inline_height
# max_preview_height
# auto_hide_height


### History
store_failed = true
# history_format
# history_filter
# cwd_filter

### Keys
bind_up_arrow = false
bind_ctrl_r = false
ctrl_n_shortcuts = false
show_numeric_shortcuts = false

### Others
command_chaining = true
enter_accept = false
prefers_reduced_motion = true
# keymap_mode = "emacs"
# keymap_cursor

# NOTE: the [search] and [keys] tables live below. TOML assigns keys to
# the most recent [header], so no top-level keys may follow a [table].
[search]
    filters = [ "global", "host"]
    shells = "all"
# frequency_score_multiplier
# recency_score_multiplier
# frecency_score_multiplier

[keys]
    scroll_exits = true
# exit_past_line_start = true
# accept_past_line_end = true
# accept_past_line_start = false
# accept_with_backspace = false

[tmux]
    enabled = true # TODO:
# width = 80%
# height = 80%


[logs]
    enabled = true
    level = "trace"
    retention = "1d"
    dir = "~/.local/share/atuin/logs/"

    [logs.ai]
        enabled = false
    
    [logs.daemon]
        enabled = false
    
    [logs.search]
        enabled = true

[daemon]
    enabled = false  # TODO:
    sync_frequency="5m"
# socket_path
# pidfile_path
# systemd_socket
# tcp_port


[output]
    enabled = false
    sync = false
# max_output_size = "1MB"
# max_disk_usage = "10%"
# command_filter = []


[security]
    redact_patterns = []
    sensitive_files = []


[ui]
    columns = ["duration", "time", "command"]
    syntax_highlight = true


[ai]
    enabled = false


[theme]
    name = "current"
