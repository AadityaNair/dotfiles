# Flexoki Dark — tmux palette.
#
# Regular accents use the 400 level and emphasized states use the brighter 300
# level. Flexoki's 600 accents are for light mode, not this dark background.
# Trailing names are the slot each colour fills, matching the neovim theme.
#
# Only the palette lives here. tmux/theme.tmux sources this and builds every
# format string from these variables.

set -g @text-inactive '#878580'       # tx-2
set -g @background-primary '#100F0F'  # bg
set -g @background-active '#4385BE'   # bl
set -g @separator-color '#575653'     # tx-3
set -g @session '#878580'             # tx-2
set -g @time "#3AA99F"                # cy
set -g @message "#E8705F"             # re-3
set -g @activity "#DA702C"            # or
set -g @border-pane "#66A0C8"         # bl-3
set -g @copy-mark-bg "#8B7EC8"        # pu
set -g @comment "#575653"             # tx-3

# vim: ft=tmux
